<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
  <!-- Side arcs (left and right) -->
  <ellipse cx="-60" cy="450" rx="720" ry="820" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <ellipse cx="-60" cy="450" rx="580" ry="660" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <ellipse cx="1500" cy="450" rx="720" ry="820" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <ellipse cx="1500" cy="450" rx="580" ry="660" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <!-- Vertical measurement lines -->
  <line x1="360" y1="0" x2="360" y2="900" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="1080" y1="0" x2="1080" y2="900" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <!-- Corner brackets -->
  <polyline points="24,68 24,24 68,24" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
  <polyline points="1416,68 1416,24 1372,24" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
  <polyline points="24,832 24,876 68,876" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
  <polyline points="1416,832 1416,876 1372,876" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
  <!-- Small squares at corners -->
  <rect x="20" y="20" width="6" height="6" fill="rgba(255,255,255,0.15)"/>
  <rect x="1414" y="20" width="6" height="6" fill="rgba(255,255,255,0.15)"/>
  <rect x="20" y="874" width="6" height="6" fill="rgba(255,255,255,0.15)"/>
  <rect x="1414" y="874" width="6" height="6" fill="rgba(255,255,255,0.15)"/>
  <!-- Top/bottom center ticks -->
  <line x1="720" y1="20" x2="720" y2="46" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <line x1="720" y1="854" x2="720" y2="880" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <!-- Left/right center ticks -->
  <line x1="20" y1="450" x2="46" y2="450" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <line x1="1394" y1="450" x2="1420" y2="450" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <!-- Center marker squares top/bottom -->
  <rect x="713" y="17" width="14" height="14" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
  <rect x="713" y="869" width="14" height="14" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
  <!-- Diamond markers at sides -->
  <rect x="11" y="441" width="18" height="18" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.2)" stroke-width="1" transform="rotate(45 20 450)"/>
  <rect x="1411" y="441" width="18" height="18" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.2)" stroke-width="1" transform="rotate(45 1420 450)"/>
  <!-- Dashed lines top/bottom -->
  <line x1="96" y1="24" x2="600" y2="24" stroke="rgba(255,255,255,0.09)" stroke-width="1" stroke-dasharray="4 8"/>
  <line x1="840" y1="24" x2="1344" y2="24" stroke="rgba(255,255,255,0.09)" stroke-width="1" stroke-dasharray="4 8"/>
  <line x1="96" y1="876" x2="600" y2="876" stroke="rgba(255,255,255,0.09)" stroke-width="1" stroke-dasharray="4 8"/>
  <line x1="840" y1="876" x2="1344" y2="876" stroke="rgba(255,255,255,0.09)" stroke-width="1" stroke-dasharray="4 8"/>
  <!-- 3-dot groups at sides -->
  <circle cx="52" cy="432" r="2" fill="rgba(255,255,255,0.28)"/>
  <circle cx="52" cy="450" r="2" fill="rgba(255,255,255,0.28)"/>
  <circle cx="52" cy="468" r="2" fill="rgba(255,255,255,0.28)"/>
  <circle cx="1388" cy="432" r="2" fill="rgba(255,255,255,0.28)"/>
  <circle cx="1388" cy="450" r="2" fill="rgba(255,255,255,0.28)"/>
  <circle cx="1388" cy="468" r="2" fill="rgba(255,255,255,0.28)"/>
  <!-- Measurement ticks at vertical lines -->
  <line x1="360" y1="24" x2="360" y2="52" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
  <line x1="360" y1="848" x2="360" y2="876" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
  <line x1="1080" y1="24" x2="1080" y2="52" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
  <line x1="1080" y1="848" x2="1080" y2="876" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
  <!-- Triangle indicators at vertical lines -->
  <polygon points="354,450 368,438 368,462" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
  <polygon points="1086,450 1072,438 1072,462" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
  <!-- Grid intersection marks -->
  <rect x="354" y="17" width="12" height="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
  <rect x="354" y="871" width="12" height="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
  <rect x="1074" y="17" width="12" height="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
  <rect x="1074" y="871" width="12" height="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
  <!-- Chevrons at bottom -->
  <polyline points="692,855 720,836 748,855" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
  <polyline points="692,869 720,850 748,869" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <!-- Bracket markers at vertical lines mid-height -->
  <line x1="351" y1="441" x2="351" y2="459" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
  <line x1="1089" y1="441" x2="1089" y2="459" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
</svg>
